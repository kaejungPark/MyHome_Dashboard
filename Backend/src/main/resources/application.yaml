spring:
  application:
    name: myhome
  datasource:
    url: "jdbc:sqlserver://localhost:1433;databaseName=MyHome;encrypt=true;trustServerCertificate=true"
    username: myhome_app
    password: ${MYHOME_DB_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: 8080

# 로그인 기능 도입 전까지 사용할 단일 개발 사용자 ID
app:
  user-id: 8